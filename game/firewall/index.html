<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセス制御：ファイアウォール</title>
    <!-- 귀여운 도트 느낌의 픽셀 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #E1F5FE; 
            --container-bg: #FFFFFF;
            --text-main: #2C3E50;
            --border-color: #2980B9;
            --alert: #E74C3C;
            --allow: #2ECC71;
            --highlight: #F39C12;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'DotGothic16', 'Malgun Gothic', 'Meiryo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        
        /* 모바일 대응을 위해 고정 픽셀 대신 max-width 사용 */
        .window-box {
            width: 95%;
            max-width: 700px;
            height: 95vh;
            max-height: 550px;
            border: 4px solid var(--border-color);
            border-radius: 12px;
            background: var(--container-bg);
            box-shadow: 0 8px 0 rgba(41, 128, 185, 0.2);
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        /* Start Screen */
        #start-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
        }
        #start-screen h1 {
            font-size: 45px;
            color: var(--border-color);
            margin-bottom: 20px;
            margin-top: 0;
            text-shadow: 2px 2px 0 #FFF, 4px 4px 0 rgba(41, 128, 185, 0.2);
            text-align: center;
            line-height: 1.3;
        }
        #t-subtitle {
            font-size: 17px;
            color: var(--text-main);
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.7);
            padding: 5px 15px;
            border-radius: 20px;
        }
        #lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFF;
            color: var(--border-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            font-weight: bold;
            z-index: 50;
        }
        #lang-toggle:hover {
            background: var(--border-color);
            color: #FFF;
        }
        .maker-credit {
            margin-top: 20px;
            font-size: 16px;
            color: #7F8C8D;
            font-weight: bold;
        }

        /* Game Screen */
        #game-container {
            display: none; 
            grid-template-columns: 280px 1fr;
            grid-template-rows: 70px 1fr;
        }
        .header {
            grid-column: 1 / 3;
            border-bottom: 4px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 20px;
            font-weight: bold;
            background: #81D4FA;
            color: #1A365D;
        }
        .policy-board {
            border-right: 4px solid var(--border-color);
            padding: 15px;
            background: #F1F8E9;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .policy-title {
            font-size: 18px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--border-color);
        }
        .policy-list {
            list-style: none;
            padding: 0;
            line-height: 1.6;
            font-size: 14px;
            flex-grow: 1;
            color: var(--text-main);
        }
        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #FAFAFA;
            overflow-y: auto;
        }
        .packet {
            border: 4px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 85%;
            background: #FFF;
            box-shadow: 0 6px 0 var(--border-color);
            margin-bottom: 30px;
            transition: transform 0.1s;
        }
        .packet-header {
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 5px;
            font-weight: bold;
            color: var(--border-color);
        }
        .packet-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 16px;
        }
        .pkt-row {
            display: grid;
            grid-template-columns: 100px 20px 1fr;
            align-items: center;
        }
        .pkt-label {
            text-align: left;
            color: #34495E;
        }
        .pkt-colon {
            text-align: center;
            color: #34495E;
        }
        .pkt-val {
            text-align: right;
            color: #E74C3C;
            font-weight: bold;
            word-break: break-all;
        }
        .controls {
            display: flex;
            gap: 15px;
            width: 95%;
        }
        .controls .btn {
            flex: 1;
        }
        .btn {
            background: #FFF;
            border: 4px solid var(--text-main);
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 var(--text-main);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--text-main);
        }
        .btn-drop {
            border-color: var(--alert);
            color: var(--alert);
            box-shadow: 0 4px 0 var(--alert);
        }
        .btn-drop:hover {
            background: #FFEBEE;
        }
        .btn-allow {
            border-color: var(--allow);
            color: var(--allow);
            box-shadow: 0 4px 0 var(--allow);
        }
        .btn-allow:hover {
            background: #E8F5E9;
        }
        
        /* 모바일 최적화 미디어 쿼리 */
        @media (max-width: 600px) {
            .window-box {
                width: 100%;
                height: 100vh;
                max-height: none;
                border: none;
                border-radius: 0;
            }
            #game-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            .header {
                flex-direction: row;
                justify-content: space-between;
                padding: 10px 15px;
                font-size: 14px;
                grid-column: 1 / 2;
                border-bottom: 2px solid var(--border-color);
            }
            .policy-board {
                border-right: none;
                border-bottom: 4px solid var(--border-color);
                padding: 10px;
                max-height: 35vh; /* 조금 더 넓게 확보 */
            }
            .policy-title { 
                margin-bottom: 5px; 
                font-size: 14px; 
                padding-bottom: 5px;
            }
            .policy-list {
                font-size: 12px;
                line-height: 1.4;
            }
            .main-area { 
                padding: 10px; 
                justify-content: flex-start;
            }
            .packet { 
                width: 95%; 
                padding: 10px; 
                margin-top: 10px;
                margin-bottom: 15px; 
            }
            .packet-header {
                font-size: 14px;
                margin-bottom: 10px;
            }
            .pkt-row { 
                grid-template-columns: 80px 10px 1fr; 
                font-size: 13px; 
                gap: 5px;
            }
            #start-screen h1 { font-size: 32px; }
            #t-subtitle { font-size: 13px; margin-bottom: 20px; }
            .center-btn { padding: 12px 20px; font-size: 16px; }
            .controls { gap: 10px; margin-bottom: 10px; }
            .btn { padding: 12px; font-size: 15px; }
            .help-text { display: none; }
        }
        .feedback {
            position: absolute;
            top: 15px;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.4s;
            text-shadow: 1px 1px 0 #FFF, -1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF;
            z-index: 5;
        }
        .shake {
            animation: shake 0.4s;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            10% { transform: translate(-2px, -3px) rotate(-1deg); }
            20% { transform: translate(-4px, 0px) rotate(1deg); }
            30% { transform: translate(4px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -2px) rotate(1deg); }
            50% { transform: translate(-2px, 3px) rotate(-1deg); }
            60% { transform: translate(-4px, 2px) rotate(0deg); }
            70% { transform: translate(4px, 2px) rotate(-1deg); }
            80% { transform: translate(-2px, -2px) rotate(1deg); }
            90% { transform: translate(2px, 3px) rotate(0deg); }
            100% { transform: translate(2px, -3px) rotate(-1deg); }
        }
        
        /* End Screen (Overlay inside window-box) */
        #end-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(225, 245, 254, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-sizing: border-box;
            padding: 20px;
        }
        #end-title {
            font-size: 40px;
            margin-bottom: 20px;
            text-align: center;
            color: var(--border-color);
            text-shadow: 2px 2px 0 #FFF;
        }
        #end-msg {
            color: var(--text-main);
            font-size: 18px;
            text-align: center;
            line-height: 1.6;
            max-width: 90%;
            word-wrap: break-word;
            word-break: break-all;
        }
        .help-text {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: #7F8C8D;
            width: 100%;
            text-align: center;
        }
        .center-btn {
            padding: 15px 40px;
            font-size: 20px;
            margin-top: 30px;
            flex: none !important;
        }
    </style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen" class="window-box">
    <button id="lang-toggle" onclick="toggleLanguage()">한국어 (Korean)</button>
    <h1 id="t-title">アクセス制御：<br>ファイアウォール</h1>
    <div id="t-subtitle">について、簡単なゲームを通じて学んでみましょう</div>
    <button class="btn btn-allow center-btn" id="t-startBtn" onclick="startGame()">ゲームスタート</button>
    <div class="maker-credit">made by __ak_i_ra__</div>
</div>

<!-- Game Container -->
<div id="game-container" class="window-box">
    <div class="header">
        <div>FIREWALL OS v2.0</div>
        <div>
            <span id="t-score">スコア</span>: <span id="score">0</span> | 
            <span id="t-lives">ライフ</span>: <span id="lives">3</span>
        </div>
    </div>
    
    <div class="policy-board">
        <div class="policy-title" id="t-policyTitle">▶ セキュリティポリシー</div>
        <ul class="policy-list" id="policy-list">
            <!-- Rules will be injected here -->
        </ul>
        <div style="margin-top:20px; font-weight:bold; color: var(--border-color); font-size: 16px; text-align: center; border-top: 2px dashed var(--border-color); padding-top: 15px;">
            <span id="t-level">レベル</span> <span id="current-level-display">1</span> 
            (<span id="level-progress">0</span>/5)
        </div>
    </div>
    
    <div class="main-area">
        <div class="feedback" id="feedback"></div>
        
        <div class="packet" id="current-packet">
            <div class="packet-header" id="t-packetHeader">[ 受信したデータパケット ]</div>
            <div class="packet-details">
                <div class="pkt-row">
                    <span id="t-srcIp" class="pkt-label">送信元 IP</span>
                    <span class="pkt-colon">:</span>
                    <span id="pkt-src" class="pkt-val"></span>
                </div>
                <div class="pkt-row">
                    <span id="t-dstIp" class="pkt-label">宛先 IP</span>
                    <span class="pkt-colon">:</span>
                    <span id="pkt-dst" class="pkt-val"></span>
                </div>
                <div class="pkt-row">
                    <span id="t-port" class="pkt-label">ポート番号</span>
                    <span class="pkt-colon">:</span>
                    <span id="pkt-port" class="pkt-val"></span>
                </div>
                <div class="pkt-row">
                    <span id="t-proto" class="pkt-label">プロトコル</span>
                    <span class="pkt-colon">:</span>
                    <span id="pkt-proto" class="pkt-val"></span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-drop" id="t-btnDrop" onclick="handleDecision('DROP')">遮断 [ X ]</button>
            <button class="btn btn-allow" id="t-btnAllow" onclick="handleDecision('ALLOW')">許可 [ O ]</button>
        </div>
        
        <div class="help-text" id="t-help">ショートカット: (X / 左矢印) 遮断 | (O / 右矢印) 許可</div>
    </div>
    
    <!-- End Screen (Overlay inside window-box) -->
    <div id="end-screen">
        <div id="end-title"></div>
        <div id="end-msg"></div>
        <button class="btn center-btn" id="t-restartBtn" onclick="showStartScreen()">メイン画面へ</button>
    </div>
</div>

<script>
    // Web Audio API for 8-bit sound effects
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'allow') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'drop') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'over') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'clear') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    }

            rule2: "- 内部ネットワーク(10.x.x.x)IPを偽装した攻撃を検知。<br><br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> 送信元IPが 10. で始まる場合は遮断<br><br>- 残りのWebポート(80, 443)は許可",
            rule3: "- データベースおよびリモート制御ポートへの攻撃を防御！<br><br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> ポート 22 (SSH)<br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> ポート 3306 (DB)<br><span style='color:var(--allow); font-weight:bold;'>[許可]</span> 残りのすべてのポート",
            rule4: "- 特定帯域のIPアクセス遮断<br><br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> 送信元IPが 192.168. で始まる場合<br><span style='color:var(--allow); font-weight:bold;'>[許可]</span> ポート 80, 443<br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> その他ポート",
            rule5: "- DDoS防御モード！大量のUDPトラフィック制限。<br><br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> プロトコルが UDP のすべてのパケット<br><span style='color:var(--alert); font-weight:bold;'>[遮断]</span> ポート 21 (FTP)<br><span style='color:var(--allow); font-weight:bold;'>[許可]</span> その他の正常トラフィック"
        }
    };

    let lang = 'ja';
    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    let levelProgress = 0;
    let currentExpectedAction = null;
    let isPlaying = false;

    const rules = [
        { level: 1, eval: (pkt) => (pkt.port === 80 || pkt.port === 443) ? 'ALLOW' : 'DROP' },
        { level: 2, eval: (pkt) => { if(pkt.src.startsWith('10.')) return 'DROP'; if(pkt.port === 80 || pkt.port === 443) return 'ALLOW'; return 'DROP'; } },
        { level: 3, eval: (pkt) => (pkt.port === 22 || pkt.port === 3306) ? 'DROP' : 'ALLOW' },
        { level: 4, eval: (pkt) => { if(pkt.src.startsWith('192.168.')) return 'DROP'; if(pkt.port === 80 || pkt.port === 443) return 'ALLOW'; return 'DROP'; } },
        { level: 5, eval: (pkt) => { if(pkt.proto === 'UDP') return 'DROP'; if(pkt.port === 21) return 'DROP'; return 'ALLOW'; } }
    ];

    let activeRule = rules[0];

    function toggleLanguage() {
        lang = lang === 'ja' ? 'ko' : 'ja';
        updateText();
    }

    function updateText() {
        const t = i18n[lang];
        document.title = t.title.replace('<br>', ' ');
        document.documentElement.lang = lang;
        document.getElementById('t-title').innerHTML = t.title;
        document.getElementById('t-subtitle').innerText = t.subtitle;
        document.getElementById('t-startBtn').innerText = t.startBtn;
        document.getElementById('lang-toggle').innerText = t.langBtn;
        document.getElementById('t-score').innerText = t.score;
        document.getElementById('t-lives').innerText = t.lives;
        document.getElementById('t-policyTitle').innerText = t.policyTitle;
        document.getElementById('t-packetHeader').innerText = t.packetHeader;
        document.getElementById('t-srcIp').innerText = t.srcIp;
        document.getElementById('t-dstIp').innerText = t.dstIp;
        document.getElementById('t-port').innerText = t.port;
        document.getElementById('t-proto').innerText = t.proto;
        document.getElementById('t-btnDrop').innerText = t.btnDrop;
        document.getElementById('t-btnAllow').innerText = t.btnAllow;
        document.getElementById('t-help').innerText = t.help;
        document.getElementById('t-level').innerText = t.level;
        document.getElementById('t-restartBtn').innerText = t.restartBtn;
        
        if (isPlaying || currentLevel <= 5) {
            document.getElementById('policy-list').innerHTML = `<li id="rule-text">${t[`rule${currentLevel}`]}</li>`;
        }
    }

    function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function rndIp() { return `${rnd(11,223)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`; }

    function startGame() {
        initAudio(); // Initialize audio context on user gesture
        score = 0;
        lives = 3;
        currentLevel = 1;
        levelProgress = 0;
        isPlaying = true;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'grid';
        document.getElementById('end-screen').style.display = 'none';
        
        updateUI();
        generatePacket();
    }

    function showStartScreen() {
        isPlaying = false;
        document.getElementById('start-screen').style.display = 'flex';
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        updateText();
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
        document.getElementById('current-level-display').innerText = currentLevel;
        document.getElementById('level-progress').innerText = levelProgress;
        
        activeRule = rules[currentLevel - 1];
        document.getElementById('policy-list').innerHTML = `<li id="rule-text">${i18n[lang][`rule${currentLevel}`]}</li>`;
    }

    function generatePacket() {
        if(levelProgress >= 5) {
            currentLevel++;
            levelProgress = 0;
            if(currentLevel > 5) {
                gameClear();
                return;
            }
            updateUI();
        }
        
        const ports = [80, 443, 22, 3306, 21, 53, 8080];
        const protos = ['TCP', 'UDP', 'ICMP'];
        
        let src = rndIp();
        
        if(currentLevel === 2 && Math.random() > 0.5) src = `10.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`;
        if(currentLevel === 4 && Math.random() > 0.5) src = `192.168.${rnd(0,255)}.${rnd(1,254)}`;
        
        let proto = protos[rnd(0, protos.length - 1)];
        let port = ports[rnd(0, ports.length - 1)];
        
        if(currentLevel === 3 && Math.random() > 0.5) port = (Math.random() > 0.5 ? 22 : 3306);
        if(currentLevel === 5 && Math.random() > 0.5) {
            if(Math.random() > 0.5) proto = 'UDP';
            else port = 21;
        }

        const pkt = {
            src: src,
            dst: `10.0.1.${rnd(10,50)}`,
            port: port,
            proto: proto
        };
        
        currentExpectedAction = activeRule.eval(pkt);
        
        document.getElementById('pkt-src').innerText = pkt.src;
        document.getElementById('pkt-dst').innerText = pkt.dst;
        document.getElementById('pkt-port').innerText = pkt.port;
        document.getElementById('pkt-proto').innerText = pkt.proto;
    }

    function showFeedback(text, color) {
        const el = document.getElementById('feedback');
        el.innerText = text;
        el.style.color = color;
        el.style.opacity = 1;
        el.style.transform = 'scale(1.2)';
        setTimeout(() => el.style.transform = 'scale(1)', 50);
        setTimeout(() => el.style.opacity = 0, 400);
    }

    function handleDecision(action) {
        if(!isPlaying || lives <= 0) return;
        
        initAudio(); // Ensure audio context is active
        
        if(action === currentExpectedAction) {
            score += 10;
            playSound('allow');
            showFeedback(i18n[lang].pass, 'var(--allow)');
        } else {
            lives -= 1;
            playSound('drop');
            document.getElementById('game-container').classList.add('shake');
            setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 400);
            showFeedback(i18n[lang].violation, 'var(--alert)');
            
            if(lives <= 0) {
                updateUI();
                gameOver();
                return;
            }
        }
        
        levelProgress++;
        updateUI();
        setTimeout(generatePacket, 200);
    }

    function gameOver() {
        isPlaying = false;
        playSound('over');
        const endScreen = document.getElementById('end-screen');
        const t = i18n[lang];
        document.getElementById('end-title').innerText = t.gameOverTitle;
        document.getElementById('end-title').style.color = 'var(--alert)';
        document.getElementById('end-msg').innerHTML = t.gameOverMsg;
        endScreen.style.display = 'flex';
    }

    function gameClear() {
        isPlaying = false;
        playSound('clear');
        const endScreen = document.getElementById('end-screen');
        const t = i18n[lang];
        document.getElementById('end-title').innerText = t.gameClearTitle;
        document.getElementById('end-title').style.color = 'var(--allow)';
        document.getElementById('end-msg').innerHTML = t.gameClearMsg;
        endScreen.style.display = 'flex';
    }
    
    document.addEventListener('keydown', (e) => {
        if(!isPlaying) return;
        if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'x') handleDecision('DROP');
        if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'o') handleDecision('ALLOW');
    });

    // Init language setup
    updateText();

</script>
</body>
</html>
